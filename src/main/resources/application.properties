server.port=8080

# ---- H2 in-memory database ----
spring.datasource.url=jdbc:h2:mem:prreviewdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Claude API ----
# Never hardcode the key. Set it as an environment variable before running:
#   export ANTHROPIC_API_KEY=sk-ant-xxxxx   (Mac/Linux)
#   setx ANTHROPIC_API_KEY "sk-ant-xxxxx"   (Windows)
claude.api.key=${ANTHROPIC_API_KEY}
claude.api.url=https://api.anthropic.com/v1/messages
# Haiku is the cheapest model - good default while you're burning trial credits.
# Swap to claude-sonnet-5 later for noticeably better review quality.
claude.api.model=claude-haiku-4-5-20251001
claude.api.version=2023-06-01
claude.api.max-tokens=1024


# ---- GITHUB API ----
github.token=${GITHUB_TOKEN}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET}
